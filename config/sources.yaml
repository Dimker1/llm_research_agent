arxiv:
  enabled: true
  phase: mvp
  categories:
    - cs.CL   # Computation and Language
    - cs.AI   # Artificial Intelligence
    - cs.LG   # Machine Learning
  max_results: 500
  lookback_hours: 192   # 周报回溯 8 天（7天+1天缓冲）

rss:
