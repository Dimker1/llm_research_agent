name: LLM Weekly Digest

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:        # 支持手动触发（用于测试）

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 周报内容多，给更长时间

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite DB from cache
        uses: actions/cache@v4
        with:
          path: data/digest.db
          key: sqlite-db-${{ github.run_number }}
          restore-keys: |
            sqlite-db-

      - name: Run weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --mode weekly

      - name: Commit digest output
        run: |
          git config user.email "llm-digest-bot@github.com"
          git config user.name "LLM Weekly Bot"
          git add weekly/ data/ || true
          git diff --staged --quiet || git commit -m "📰 Weekly digest $(date -u +%Y-W%V)"
          git push || true
